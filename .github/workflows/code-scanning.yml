# ==============================================================================
# Generated by Auto GitHub Actions (auto-gha)
# Code Scanning & SAST Workflow (Level: standard)
# ==============================================================================

name: Code Scanning & Security Analyzers
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
  security-events: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  osv-scanner:
    name: Open Source Vulnerability Scan (Google OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden GitHub Actions Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Run Google OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: --call-analysis=false --format=sarif --output=osv-results.sarif .
        continue-on-error: true
      - name: Upload OSV-Scanner results
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv-results.sarif
