# ==============================================================================
# Generated by Auto GitHub Actions (auto-gha)
# GitHub CodeQL SAST Analysis Workflow (Level: standard)
# ==============================================================================

name: CodeQL Security Analysis
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: 0 0 * * 1
permissions:
  contents: read
  security-events: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Attempt Autobuild
        uses: github/codeql-action/autobuild@v4
        continue-on-error: true
      - name: Compile Java (Fallback)
        if: matrix.language == 'java-kotlin' || matrix.language == 'java'
        run: mkdir -p bin && find . -name '*.java' -not -path '*/.*' > sources.txt && if [ -s sources.txt ]; then javac -d bin @sources.txt || true; fi
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
